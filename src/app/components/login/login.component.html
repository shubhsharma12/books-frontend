<div class="container login-form">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="submitForm()">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        class="form-control"
        id="email"
        formControlName="email"
      />
      <div
        *ngIf="
          loginForm.get('email')?.touched && loginForm.get('email')?.invalid
        "
        class="text-danger"
      >
        <small *ngIf="loginForm.get('email')?.hasError('required')"
          >Email is required.</small
        >
        <small *ngIf="loginForm.get('email')?.hasError('email')"
          >Invalid email format.</small
        >
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        class="form-control"
        id="password"
        formControlName="password"
      />
      <div
        *ngIf="
          loginForm.get('password')?.touched &&
          loginForm.get('password')?.invalid
        "
        class="text-danger"
      >
        <small *ngIf="loginForm.get('password')?.hasError('required')"
          >Password is required.</small
        >
        <small *ngIf="loginForm.get('password')?.hasError('minlength')"
          >Password must be at least 6 characters long.</small
        >
        <small *ngIf="loginForm.get('email')?.hasError('pattern')"
          >Invalid email format. It should contain "&#64;" and a domain.</small
        >
      </div>
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="loginForm.invalid"
    >
      Login
    </button>
  </form>
</div>
